[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# domain
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# http
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"

# tokenisation
tiktoken-rs = "0.9"

# validation
jsonschema = "0.29"

# error handling
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# internal crates
stratum-types = { path = "crates/stratum-types" }
stratum-core = { path = "crates/stratum-core" }
stratum-context = { path = "crates/stratum-context" }
stratum-memory = { path = "crates/stratum-memory" }
stratum-tools = { path = "crates/stratum-tools" }
stratum-orchestrator = { path = "crates/stratum-orchestrator" }
stratum-adapters = { path = "crates/stratum-adapters" }
stratum-test-utils = { path = "crates/stratum-test-utils" }

# test dependencies
rstest = "0.25"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"
